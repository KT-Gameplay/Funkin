name: Build Game and Upload

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      # Checkout repository and submodules
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Install Haxe
      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      # Configure and verify Haxe environment
      - name: Configure Haxe Environment
        shell: pwsh
        run: |
          $haxeExe = (Get-Command haxe.exe).Source
          $haxePath = Split-Path $haxeExe

          Write-Host "Haxe executable: $haxeExe"
          Write-Host "Haxe directory: $haxePath"

          "HAXEPATH=$haxePath" >> $env:GITHUB_ENV

          haxe -version
          haxelib config

      # Install HMM
      - name: Install HMM
        shell: pwsh
        run: |
          haxelib --global install hmm
          haxelib --global run hmm setup

      # Install project dependencies
      - name: Install Haxelibs
        shell: pwsh
        run: |
          hmm install

      # Setup Visual Studio environment
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Compile hxcpp command-line tool
      - name: Build hxcpp
        shell: pwsh
        run: |
          $hxcppPath = ".haxelib/hxcpp/git/tools/hxcpp"

          if (!(Test-Path "$hxcppPath/compile.hxml")) {
            throw "hxcpp compile.hxml not found at $hxcppPath"
          }

          Push-Location $hxcppPath
          try {
            haxe compile.hxml
          }
          finally {
            Pop-Location
          }

      # Rebuild Lime native libraries
      - name: Rebuild Lime
        shell: pwsh
        run: |
          haxelib run lime rebuild windows

      # Setup Lime
      - name: Setup Lime
        shell: pwsh
        run: |
          haxelib run lime setup

      # Compile Friday Night Funkin'
      - name: Build Windows
        shell: pwsh
        run: |
          haxelib run lime build windows -DGITHUB_BUILD

      # Upload compiled game
      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: funkin-windows-64bit
          path: export/release/windows/bin/
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
