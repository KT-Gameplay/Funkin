name: Build Game and Upload

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      # Checkout repository and its submodules
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Install Haxe
      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2.1.0
        with:
          haxe-version: 4.3.7

      # Install HMM
      - name: Install HMM
        run: |
          haxelib --global install hmm
          haxelib --global run hmm setup

      # Install project dependencies
      - name: Install Haxelibs
        run: hmm install

      # Setup Visual Studio environment
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Rebuild Lime native libraries
      - name: Rebuild Lime
        run: lime rebuild windows

      # Setup Lime
      - name: Setup Lime
        run: haxelib run lime setup

      # Compile Friday Night Funkin'
      - name: Build Windows
        run: lime build windows -DGITHUB_BUILD

      # Upload compiled game
      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: funkin-windows-64bit
          path: export/release/windows/bin/
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
